<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">TOMOSHA original cinematic hero artwork</title><desc id="desc">Abstract night city lights, broadcast rings, and a warm saffron horizon created for the TOMOSHA demo.</desc><defs><linearGradient id="sky" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101820"/><stop offset=".48" stop-color="#16333a"/><stop offset="1" stop-color="#3b2411"/></linearGradient><radialGradient id="sun" cx="78%" cy="28%" r="48%"><stop stop-color="#f5b72e" stop-opacity=".9"/><stop offset="1" stop-color="#f5b72e" stop-opacity="0"/></radialGradient><linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop offset=".4" stop-color="#050607" stop-opacity="0"/><stop offset="1" stop-color="#050607"/></linearGradient><filter id="blur"><feGaussianBlur stdDeviation="18"/></filter></defs><rect width="1600" height="900" fill="url(#sky)"/><rect width="1600" height="900" fill="url(#sun)"/><g fill="none" stroke="#9bd8d1" stroke-opacity=".18" stroke-width="2"><ellipse cx="1120" cy="360" rx="430" ry="220"/><ellipse cx="1120" cy="360" rx="330" ry="170"/><ellipse cx="1120" cy="360" rx="230" ry="115"/></g><g filter="url(#blur)" fill="#f5b72e" opacity=".65"><circle cx="240" cy="610" r="55"/><circle cx="380" cy="540" r="32"/><circle cx="540" cy="650" r="76"/><circle cx="1300" cy="570" r="48"/><circle cx="1430" cy="680" r="82"/></g><path d="M0 680 180 580l120 70 160-130 130 100 180-165 170 150 190-125 210 120 140-105 120 90v315H0Z" fill="#071013" fill-opacity=".88"/><path d="M0 0h1600v900H0z" fill="url(#fade)"/></svg>